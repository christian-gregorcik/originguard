[package]
name = "originguard"
version = "0.1.0"
edition = "2021"
description = "Web origin, cookie partitioning and Content-Security-Policy rules, implemented from the specifications with no dependencies."
license = "MIT"
repository = "https://github.com/christian-gregorcik/originguard"
readme = "README.md"
keywords = ["csp", "same-origin", "cookies", "privacy", "security"]
categories = ["web-programming", "parser-implementations"]

[dependencies]

[lib]
name = "originguard"
path = "src/lib.rs"

[[bin]]
name = "originguard"
path = "src/bin/originguard.rs"

[profile.release]
lto = true
